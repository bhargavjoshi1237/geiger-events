<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geiger Events</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      /* The window is transparent; the page is the visible window, rounded like the app and square when maximized */
      html {
        overflow: hidden;
        background: transparent;
        background-image: linear-gradient(transparent, transparent);
      }
      body {
        border: 1px solid rgb(255 255 255 / 0.06);
        border-radius: 12px;
      }
      html[data-maximized] body {
        border: 0;
        border-radius: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #161616;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* The window has no native frame, so this strip drags it and carries our own controls, sized like the app header */
      .titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        height: 56px;
        padding-right: 12px;
        background: transparent;
        -webkit-app-region: drag;
      }
      .titlebar[hidden],
      .controls[hidden] {
        display: none;
      }
      button {
        -webkit-app-region: no-drag;
      }
      .controls {
        display: flex;
        gap: 4px;
      }
      .controls button {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #a3a3a3;
        cursor: default;
      }
      .controls button:hover {
        background: #262626;
        color: #fafafa;
      }
      .controls .close:hover {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
      }
      .controls button:focus-visible {
        outline: 2px solid #71717a;
        outline-offset: -2px;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      /* Same tile as build/icon.png, inlined because the CSP blocks image loads */
      .icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #171717;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        color: #fafafa;
      }
      .icon svg {
        width: 36px;
        height: auto;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.5;
        color: #a1a1aa;
      }
      main button {
        height: 36px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: #fafafa;
        color: #0a0a0a;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      main button:hover {
        background: #e4e4e7;
      }
      main button:focus-visible {
        outline: 2px solid #71717a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <header class="titlebar" id="titlebar">
      <div class="controls" id="controls" hidden>
        <button type="button" data-action="minimize" aria-label="Minimize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14" /></svg>
        </button>
        <button type="button" data-action="toggle-maximize" aria-label="Maximize">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="5" y="5" rx="2" /></svg>
        </button>
        <button type="button" class="close" data-action="close" aria-label="Close">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /><path d="m6 6 12 12" /></svg>
        </button>
      </div>
    </header>
    <main>
      <div class="icon">
        <svg viewBox="0 0 467 285" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M427.054 1.17427C431.046 1.15338 464.984 0.670938 466.079 1.40804C466.298 4.01125 464.421 3.92073 463.267 6.18971C450.436 31.3381 435.978 55.3181 422.003 79.8289L339.669 223C327.843 243.287 317.065 263.871 304.413 283.952L285.161 283.494C273.521 283.311 254.97 282.561 244.096 284C255.18 269.451 265.622 246.845 275.646 231.004C280.056 224.033 284.971 216.613 289.146 209.596C302.879 186.047 316.389 162.368 329.675 138.564C346.203 109.513 363.065 80.653 380.256 51.9898C390.11 35.4483 398.71 17.3651 409.366 1.55774C415.08 1.29513 421.301 1.29165 427.054 1.17427Z" />
          <path d="M218.309 1.31216L224 1.15608L193.641 50.3271L170.178 91.0997L136.561 149.51L124.008 172.428L103.37 206.726L77.2097 251.035L57.3197 283.677L6.18221 283.433L0 284.156L22.4687 244.331L54.6016 189.816L75.3213 152.467L94.3273 119.376L144.096 31L161 1.15608L218.309 1.31216Z" />
          <path d="M344.758 0L345.096 0.735049C326.643 33.9528 307.753 66.9251 288.428 99.6433C284.236 106.683 278.484 114.061 274.613 121.064C265.581 137.399 256.332 153.496 247.097 169.697L208.592 236.882C199.377 253.009 192.444 267.92 180.666 282.525C163.285 284.093 142.445 282.6 123.432 284L123.098 283.728C123.005 282.163 127.788 276.233 129.062 273.917C135.826 261.605 142.61 249.297 149.637 237.134L240.526 79.7429C249.025 64.9272 257.723 50.1984 266.187 35.3414C268.992 30.4177 277.596 15 285.096 0.735052C305.596 0.735046 325.596 0.735049 344.131 0.1168L344.758 0Z" />
        </svg>
      </div>
      <h1 id="title">Can't reach Geiger Events</h1>
      <p id="message">Check your internet connection, then try again.</p>
      <button id="retry" type="button" autofocus>Retry</button>
    </main>
    <script>
      // Same page for "no connection" and "server has no desktop pages"; main says which in the query string.
      if (new URLSearchParams(location.search).get("reason") === "unavailable") {
        document.getElementById("title").textContent = "Geiger Events isn't available right now";
        document.getElementById("message").textContent = "The server couldn't open the desktop app. Try again in a little while.";
      }

      document.getElementById("retry").addEventListener("click", function () {
        var target = new URLSearchParams(location.search).get("url") || "";
        if (/^https?:\/\//i.test(target)) location.replace(target);
      });

      (function () {
        var bridge = window.geigerDesktop;
        var controls = document.getElementById("controls");
        // macOS keeps its native frame, so neither the drag strip nor the controls belong there
        if (bridge && bridge.platform === "darwin") {
          document.getElementById("titlebar").hidden = true;
          return;
        }
        // Without the bridge (e.g. opened in a browser) the buttons could do nothing, so they stay hidden
        if (!bridge || typeof bridge.windowControl !== "function") return;
        controls.hidden = false;
        controls.addEventListener("click", function (event) {
          var button = event.target.closest("button[data-action]");
          if (button) bridge.windowControl(button.getAttribute("data-action"));
        });
      })();
    </script>
  </body>
</html>
